name = "siteshmot-bot"
main = "cloudflare-worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./out"
binding = "ASSETS"

# Перша база даних: База даних покупців та адрес доставки (Cloudflare D1)
[[d1_databases]]
binding = "DB_CUSTOMERS"
database_name = "mellow-customers-db"
database_id = "edaafba7-bc19-4c25-a76b-fbe5ac526ccb"
migrations_dir = "db/migrations"

# Друга база даних: База даних товарів (Cloudflare D1)
[[d1_databases]]
binding = "DB_PRODUCTS"
database_name = "mellow-products-db"
database_id = "64583af5-9651-427e-bbf1-9f593100f056"
migrations_dir = "db/migrations"
